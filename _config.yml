title: Jean Barbier
tagline: Physics of learning + Maths of high dimensions
description: >-
  Jean Barbier and the Barbier group at ICTP Trieste study learning in neural
  networks with statistical physics, random matrix theory and information theory.
url: https://jeanbarbier.github.io
baseurl: ""
lang: en

author:
  name: Jean Barbier

# Funding acknowledgement shown in the footer. Fill in the ERC grant agreement
# number (it appears on the grant agreement / ERC portal).
erc:
  acronym: CHORAL
  grant_number: "101039794"

nav:
  - { title: Group, url: /group/ }
  - { title: Research, url: /research/ }
  - { title: Teaching, url: /teaching/ }
  - { title: Events, url: /events/ }
  - { title: Misc, url: /misc/ }

image: /assets/img/og-image.jpg
twitter:
  card: summary_large_image

collections:
  highlights:
    output: true
    permalink: /highlights/:name/

defaults:
  - scope: { path: "", type: highlights }
    values: { layout: highlight }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
