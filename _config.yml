title: Jean Barbier
tagline: Physics of learning + Maths of high dimensions
description: >-
  Jean Barbier and the Barbier group at ICTP Trieste study learning in neural
  networks with statistical physics, random matrix theory and information theory.
url: https://jeanbarbier.github.io
baseurl: ""
lang: en

author:
  name: Jean Barbier

# Funding acknowledgement shown in the footer. Fill in the ERC grant agreement
# number (it appears on the grant agreement / ERC portal).
# Access key for the Misc page form (Web3Forms; public by design, it only sends to Jean).
web3forms_key: "5a50d335-3bf0-4d10-839c-993e2751ba04"

erc:
  acronym: CHORAL
  grant_number: "101039794"

nav:
  - { title: Group, url: /group/ }
  - { title: Research, url: /research/ }
  - { title: Teaching, url: /teaching/ }
  - { title: Events, url: /events/ }
  - { title: Misc, url: /misc/ }


collections:
  highlights:
    output: true
    permalink: /highlights/:name/

defaults:
  # Link previews (Slack, email, social media): the site logo, the BBP curve, as a small square card.
  - scope: { path: "" }
    values:
      image: { path: /assets/img/og-image.png, width: 1200, height: 1200, alt: "Logo of the site: the BBP phase transition curve" }
      twitter: { card: summary }
  - scope: { path: "", type: highlights }
    values: { layout: highlight }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
