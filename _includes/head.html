<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15181d">
<script>
  // Apply the visitor's saved light/dark choice before first paint; dark if none was saved.
  document.documentElement.classList.add('js');
  (function () {
    var t = 'dark';
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') t = saved;
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
  })();
</script>
