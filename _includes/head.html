<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15181d">
<script>
  // Light or dark: the visitor's saved choice if any, otherwise the system setting, applied before
  // first paint and followed live if the system switches (e.g. at sunset) while no choice is saved.
  document.documentElement.classList.add('js');
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function saved() {
      try { var s = localStorage.getItem('theme'); return (s === 'light' || s === 'dark') ? s : null; }
      catch (e) { return null; }
    }
    function apply(t) {
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#15181d' : '#ffffff');
    }
    apply(saved() || (mq && mq.matches ? 'dark' : 'light'));
    if (mq && mq.addEventListener) mq.addEventListener('change', function (e) {
      if (!saved()) apply(e.matches ? 'dark' : 'light');
    });
  })();
</script>
