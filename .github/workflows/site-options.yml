# After every push to master (including edits made on github.com), regenerate SITE_OPTIONS.md
# from the code and data, and commit it if it changed. A few seconds of a GitHub runner.
name: Update SITE_OPTIONS.md
on:
  push:
    branches: [master]
    paths-ignore: [SITE_OPTIONS.md]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/site_options.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet SITE_OPTIONS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SITE_OPTIONS.md
            git commit -m "Update SITE_OPTIONS.md"
            git push
          fi
