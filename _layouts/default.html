<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main" class="wrap">
{% if page.heading %}<h1 class="page-title">{{ page.heading }}</h1>{% endif %}
{% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
