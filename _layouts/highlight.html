---
layout: default
---
{%- assign pub = site.data.publications | where: "highlight", page.url | first -%}
<article class="highlight">
  <p class="crumb"><a href="{{ '/research/#highlights' | relative_url }}">Research: highlights</a></p>
  <h1 class="page-title">{{ page.title }}</h1>
  {%- if pub %}
  <ul class="pubs compact grouped highlight-paper">{% include pub.html pub=pub hide_highlight=true %}</ul>
  {%- endif %}
  <div class="prose">
{{ content }}
  </div>
</article>
