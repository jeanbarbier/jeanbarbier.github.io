---
layout: default
---
{%- assign pub = site.data.publications | where: "highlight", page.url | first -%}
<article class="highlight">
  <p class="crumb"><a href="{{ '/highlights/' | relative_url }}">Highlights</a></p>
  <h1 class="page-title">{{ page.title }}</h1>
  {%- if pub %}
  <ul class="pubs highlight-paper">{% include pub.html pub=pub %}</ul>
  {%- endif %}
  <div class="prose">
{{ content }}
  </div>
</article>
